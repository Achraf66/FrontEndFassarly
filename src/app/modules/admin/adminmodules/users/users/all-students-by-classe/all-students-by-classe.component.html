   <p-toast></p-toast>
   <p-confirmDialog></p-confirmDialog>
   
   <h1 class="centered-title">
    {{ getClassNameInArabic(className) }}
   </h1>
   <div class="full-width-table-container">

        <p-table [value]="studentList"  
                    [rowHover]="true"
                    [tableStyle]="{'min-width': '100em' }" 
                    [rows]="5" 
                    [showCurrentPageReport]="true" 
                    [rowsPerPageOptions]="[5,10,15]" 
                    [paginator]="true"
                    #dt2
                    [globalFilterFields]="['nomPrenom', 'numeroTel', 'dateCreation', 'accountActivated']"
                    >

        <ng-template pTemplate="caption">
            <div class="flex">
                <input 
                    pInputText 
                    type="text" 
                    (input)="onInput($event)" 
                    placeholder="البحث" 
                />
            </div>
                        </ng-template>
        
            <ng-template pTemplate="header">
                    <tr>
                        <th >الصورة الشخصية</th>
                        <th pSortableColumn="nomPrenom">
                            <div class="sortable-header">الاسم واللقب
                            <p-sortIcon></p-sortIcon>
                            </div>
                        </th>      
                        <th pSortableColumn="numeroTel">
                            <div class="sortable-header">رقم الهاتف
                            <p-sortIcon></p-sortIcon>
                            </div>
                        </th> 
                        <th pSortableColumn="dateCreation">
                        <div class="sortable-header">تاريخ انشاء الحساب
                            <p-sortIcon></p-sortIcon>
                        </div>
                        </th>
                        
                        <th pSortableColumn="smsVerified">
                        <div class="sortable-header">تفعيل الحساب عبر الهاتف
                            <p-sortIcon></p-sortIcon>
                        </div>
                        </th>
            
                        <th pSortableColumn="accountActivated">
                        <div class="sortable-header">تفعيل الحساب عبر المشرف 
                            <p-sortIcon></p-sortIcon>
                            </div>
                        </th>
            
            
                        <th>
                            <div>المستوى
                            </div>
                        </th>
                        
                        
                        <th>المحاسبات</th>
                        <th></th>
            
                    </tr>
                </ng-template>
            <ng-template pTemplate="body" let-student>
                <tr>
                    <td>
                    <div style="width: 100px; height: 100px; border-radius: 50%; overflow: hidden;">             
                        <p-image   class="rounded-circle shadow-4-strong" *ngIf="student.photo !==null" [preview]="true"  [src]="student.photo" ></p-image>          
                        <p-image   class="rounded-circle shadow-4-strong" *ngIf="student.photo ===null" [preview]="true" src="assets/images/author/author-16.jpg" ></p-image>
                    </div>
                    </td>
                    
                    <td>{{student.nomPrenom}}</td>
                    
                    <td>{{student.numeroTel}}</td>
                    
                    <td style="width: 15%;">{{student.dateCreation}}</td>
    
                    <td style="width: 15%;" *ngIf="student.smsVerified"><h5 style="color: green;">نعم</h5></td>
                    
                    <td style="width: 15%;" *ngIf="!student.smsVerified">
                    <h5 style="color: rgb(255, 28, 7);">لا</h5>
                    </td>
    
                    <td style="width: 15%;" *ngIf="student.accountActivated"><h5 style="color: green;">نعم</h5></td>
                    
                    <td style="width: 15%;" *ngIf="!student.accountActivated">
                    <h5 style="color: rgb(255, 28, 7);">لا</h5>
                    </td>
    
                <td>
                    <span *ngFor="let role of student.roles; let last = last">
                        {{ role.displayName }}
                        <span *ngIf="!last">| </span>
                    </span>
                    </td>
                    <td>
                        <a class="hover-pointer" (click)="openModalComptabilite(student.id,student.nomPrenom,student.numeroTel)" style="background-color: transparent; border: 0cap;"><i class="pi pi-calculator"></i></a></td>
            
                        <td>
                        <p-button (onClick)="EditAppUserByIdComponent(student.id)"  severity="info" [text]="true"
                            label="تعديل بيانات المستخدم" icon="pi pi-user-edit"></p-button>
                        &nbsp;
                        <p-button  (onClick)="deleteUserById(student.id)" [text]="true" severity="danger"  label="حذف المستخدم" icon="pi pi-user-minus"></p-button>
                    </td>      
                   </tr>
                </ng-template>
        </p-table>
        
   </div>
